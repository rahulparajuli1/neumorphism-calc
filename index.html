<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Neumorphism Calculator</title>
<link rel="stylesheet" href="style.css">
   </head>

  <body>
    <!-- container -->
    <div class="calculator">
        <p>CASIO</p>
      <!-- calculator screen -->
      <div class="display">
        <small>100*</small>
        <!-- history of calculator -->
        <h1>50</h1>
        <!-- input value of calculator-->
      </div>

      <!-- buttons of calculator-->
      <div class="buttons">
        <!--First row calculator-->
        <button class="operator">C</button>
        <button class="operator">del</button>
        <button class="operator">%</button>
        <button class="operator">÷</button>
        <!--Second row  button calculator-->
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">×</button>

        <!--Third row button calculator-->
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">−</button>
        <!--Fourth row button  calculator-->
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator">+</button>
        <!--Fifth row button calculator-->
        <button class="operator">.</button>
        <button class="zero">0</button>
        <button class="coffe">☕</button>
        <button class="operator">=</button>
      </div>

      <!--footer of calculator-->
      <footer class="footer">&copy;Created by rahul @ 2026</footer>
    </div>
  </body>
</html>
